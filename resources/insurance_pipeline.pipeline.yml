# Lakeflow Spark Declarative Pipeline (serverless) that materializes the medallion.
# Referenced by databricks.yml; deployed with `databricks bundle deploy`.
# Source lives in src/pipelines/ (start from either the .sql or the .py — not both).

# Notes to myself:
# This file defines the Lakeflow pipeline resource. 
# It tells Databricks what transformation files to run, the destinations (catalog.schema), settings etc
# The pipeline DAG is automatically created

resources: # the top level section for Databricks resources managed by the bundle
  pipelines: # we want to manage one pipeline
    insurance_pipeline: # identifier for the pipeline resource
      name: insurance-medallion-${bundle.target} # The visible pipeline name: ${bundle.target} will be dev/test/prod depending on the target used (dev - target name, -t dev - select the target, mode: development - the deployment behavior)
      # the 2 below represent the location of the datasets created by the pipeline
      catalog: ${var.catalog} # the catalog in that variable from databricks.yml
      schema: ${var.pipeline_schema} # the schema from the variable - depends on the target (deployment mode)
      serverless: true # run using serverless compute - you don't manually configure the cluster size or when to stop / start one
      photon: true # optimized execution engine
      development: true            # the pipeline is used for development and frequent iteration - set false in production via the target override if desired
      continuous: false            # triggered (run by the job); not always-on - the pipeline is not always running - it waits until something explicitly starts it
      configuration: # this defines configuration values available to the pipeline code at runtime
        # exposed to the pipeline code; ties to src/common/config.py DEV_SCHEMA_PREFIX
        DEV_SCHEMA_PREFIX: "${workspace.current_user.short_name}"
      libraries: # this tells the pipeline which source files 
        - file:
            path: ../src/pipelines/bronze.py
        - file:
            path: ../src/pipelines/silver.py
        - file:
            path: ../src/pipelines/gold.sql
