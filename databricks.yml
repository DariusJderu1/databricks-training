# Declarative Automation Bundle root (formerly "Databricks Asset Bundles").
# Packages the Lakeflow Job + Lakeflow Spark Declarative Pipeline and promotes them across
# dev / test / prod with `databricks bundle validate|deploy|run`. (Exam domain 5 — M7.)
#
# Quick start:
#   databricks bundle validate -t dev             - checks if the bundle is configured correctly (settings, yaml files, references)
#   databricks bundle deploy   -t dev             - publishes the project in Databricks Workspace (uploads the files, creates/updates the pipelines and jobs)
#   databricks bundle run insurance_ingest -t dev - starts the job
#
# Fill in your workspace host(s) below (or set them via DATABRICKS_HOST / a CLI profile).


# Notes to myself:
# File for managing the deployment bundle

# the deployable project package 
bundle:
  name: insurance-lakehouse

variables:
  catalog:
    description: Unity Catalog for the project.
    default: insurance 
  pipeline_schema:
    description: Schema the declarative pipeline materializes into.
    default: medallion # one schema instead of 3 for simplificaton
  notification_email:
    description: Email for job failure / DQ alerts.
    default: jderudarius@gmail.com

# This tells Databricks to load all YAML files inside resources/
include:
  - resources/*.yml

# `dev` uses development mode (resources get your username prefix; schedules are paused) and
# passes a per-user schema prefix into the pipeline/job so people sharing a workspace don't
# collide. `prod` runs as a service identity with schedules live.
targets:
  dev: # the name of the deployment target
    mode: development # the development mode
    default: true # commands such as databricks bundle deploy use dev by default unless you explicitly specify another target
    workspace:
      host: https://dbc-5b27b85d-cb6d.cloud.databricks.com/browse?o=7474650233247037
    variables:
      pipeline_schema: medallion_dev # overrides the global default "medallion"

  test:
    mode: development
    workspace:
      host: https://dbc-5b27b85d-cb6d.cloud.databricks.com/browse?o=7474650233247037
    variables:
      pipeline_schema: medallion_test

  prod:
    mode: production
    workspace:
      host: https://dbc-5b27b85d-cb6d.cloud.databricks.com/browse?o=7474650233247037
    run_as:
      user_name: jderudarius@gmail.com
    variables:
      pipeline_schema: medallion
